name: Windows x64 VST3 and core contracts
on:
  push:
    branches: [main]
    paths: ['src/**','tests/**','CMakeLists.txt','.github/workflows/windows.yml','tools/**','resources/**','.gitattributes']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Provision pinned FFmpeg fixture tool
        id: ffmpeg
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check imageio-ffmpeg==0.6.0 pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Pinned FFmpeg wheel installation failed" }
          $source = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $source -PathType Leaf)) { throw "FFmpeg executable unavailable" }
          New-Item -ItemType Directory -Force -Path fixture-tools | Out-Null
          Copy-Item $source fixture-tools/ffmpeg.exe
          Get-FileHash fixture-tools/ffmpeg.exe -Algorithm SHA256 | Format-List
          (Resolve-Path fixture-tools).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare original GUI resources
        shell: pwsh
        run: |
          python tools/prepare_native_gui.py gui-draft
          if ($LASTEXITCODE -ne 0) { throw "GUI resource preparation failed" }
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCHOPPER_BUILD_VST3=ON
      - name: Compile
        run: cmake --build build --config Release --parallel --target chopper_core_tests chopper_extended_tests chopper_host_tests chopper_native_tests Chopperator validator
      - name: Core and host-engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify exact staged Windows bundle and run SDK validator
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem build -Recurse -Directory -Filter '125A Chopperator.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one built plugin bundle" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $bundles[0].FullName artifact -Recurse
          $plugin = Resolve-Path 'artifact/125A Chopperator.vst3'
          $binary = Join-Path $plugin 'Contents/x86_64-win/125A Chopperator.vst3'
          if (-not (Test-Path $binary -PathType Leaf)) { throw "Plugin bundle and inner binary naming mismatch" }
          $validator = @(Get-ChildItem build -Recurse -File -Filter validator.exe | Where-Object { $_.FullName -match 'Release' })
          if ($validator.Count -ne 1) { throw "Expected exactly one Release validator" }
          & $validator[0].FullName $plugin.Path
          if ($LASTEXITCODE -ne 0) { throw "VST3 validation failed" }
          $native = @(Get-ChildItem build -Recurse -File -Filter chopper_native_tests.exe | Where-Object { $_.FullName -match 'Release' })
          if ($native.Count -ne 1) { throw "Expected one native host test" }
          & $native[0].FullName $plugin.Path
          if ($LASTEXITCODE -ne 0) { throw "Native VST3 functional tests failed" }
          $negative = & $native[0].FullName $plugin.Path --negative-spectrum 2>&1
          $negativeExit = $LASTEXITCODE
          $negative | Write-Host
          if ($negativeExit -ne 1 -or ($negative -join ' ') -notmatch 'FAIL SINE carrier oracle') { throw "Spectral negative control did not detect wrong expected carrier" }
          Write-Host "SPECTRAL_NEGATIVE_CONTROL_PASS"
          # GitHub pwsh appends an exit using LASTEXITCODE; the intentional failure
          # above is consumed only after its exit code and diagnostic are verified.
          exit 0
      - name: Programme fixture acquisition and native PCM checks
        shell: pwsh
        run: |
          python tools/prepare_programme_fixtures.py fixtures
          if ($LASTEXITCODE -ne 0) { throw "Fixture acquisition failed" }
          $plugin = Resolve-Path 'artifact/125A Chopperator.vst3'
          $native = @(Get-ChildItem build -Recurse -File -Filter chopper_native_tests.exe | Where-Object { $_.FullName -match 'Release' })
          & $native[0].FullName $plugin.Path --programme (Resolve-Path fixtures).Path
          if ($LASTEXITCODE -ne 0) { throw "Programme test failed" }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Copy-Item fixtures/manifest.json evidence
          Get-ChildItem fixtures -Filter '*_*.f64le' | ForEach-Object {
            if ($_.BaseName -match '_(rect|sine)$') {
              ffmpeg -v error -nostdin -y -f f64le -ar 48000 -ac 2 -i $_.FullName -c:a pcm_s24le ("evidence/" + $_.BaseName + ".wav")
              if ($LASTEXITCODE -ne 0) { throw "Evidence WAV conversion failed" }
            }
          }
      - name: Independent released 125A Plugin Tester
        shell: pwsh
        run: |
          $url = 'https://github.com/challanger2000/125A-Plugin-Tester-Final/releases/download/v0.2.10/125A_Plugin_Tester.exe'
          Invoke-WebRequest -Uri $url -OutFile tester.exe
          if ((Get-FileHash tester.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b0f386422d107ac6fa8b15c3e1e86113f52b013e277fc94b16d28b929438bfea') { throw "Tester binary hash mismatch" }
          $plugin = Resolve-Path 'artifact/125A Chopperator.vst3'
          New-Item -ItemType Directory -Force -Path tester-reports | Out-Null
          ${env:125A_PLUGIN_TESTER_REPORT_DIR} = (Resolve-Path tester-reports).Path
          $process = Start-Process -FilePath (Resolve-Path tester.exe).Path -ArgumentList @('--portable-test', ('"' + $plugin.Path + '"')) -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "Tester timeout" }
          $process.Refresh()
          $reports = @(Get-ChildItem tester-reports -Recurse -File -Filter '*125A*txt')
          foreach ($report in $reports) { Copy-Item $report.FullName evidence; Get-Content $report.FullName }
          $qa = @($reports | Where-Object { $_.Name -like '*_125A_QA_Report.txt' })
          if ($process.ExitCode -ne 0 -or $qa.Count -ne 1) { throw "Tester failed or missing report: exit $($process.ExitCode)" }
          if (Select-String -Path $qa[0].FullName -Pattern '\[FAIL\]' -Quiet) { throw "Tester reported FAIL" }
          Get-FileHash (Join-Path $plugin 'Contents/x86_64-win/125A Chopperator.vst3') -Algorithm SHA256 | Format-List
          Write-Host "INDEPENDENT_TESTER_EXECUTION_PASS"
      - name: Generate static GUI draft with original 125A assets
        if: always() && steps.ffmpeg.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Copy-Item gui-draft/Chopperator-static-draft.svg evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 125A-Chopperator-P007-QA-evidence
          path: evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: 125A-Chopperator-P007-Windows-x64-development
          path: artifact
